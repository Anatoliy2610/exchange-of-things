{% extends 'base.html' %}


{% block content %}

<div class="container wrapper flex-grow-1">
 
  <h1 class="my-4">{{ title }}</h1> 
  <a class="btn btn-primary mb-3" href="{% url 'user_create' %}">Создать пользователя</a>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Фамилия</th>
        <th>Имя пользователя</th>
        <th>Email</th>
        <th></th>
      </tr>
    </thead>
  <tbody>
{% if user %}
    {% for us in user %}
    <tr>
      <td>{{ us.pk }}</td>
      <td>{{ us.first_name }}</td>
      <td>{{ us.last_name }}</td>
      <td>{{ us.username }}</td>
      <td>{{ us.email }}</td>
      <td>
        <a href="{% url 'user_update' us.pk %}">Изменить</a>
        <br>
        <a href="{% url 'user_delete' us.pk %}">Удалить</a>

      </td>
    </tr>
  {% endfor %}
{% endif %}
  </tbody>
  </table>

</div>


{% endblock %}
