{% extends 'base.html' %}


{% block content %}

<div class="container wrapper flex-grow-1">
 
  <h1 class="my-4">{{ title }}</h1> 
  <a class="btn btn-primary mb-3" href="{% url 'category_create' %}">Создать категорию товара</a>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Название категории товара</th>
        <th></th>
      </tr>
    </thead>
  <tbody>

    {% for categ in category %}
    <tr>
      <td>{{ categ.pk }}</td>
      <td>{{ categ.name }}</td>
      <td>
        <a href="{% url 'category_update' categ.pk %}">Изменить</a>
        <br>
        <a href="{% url 'category_delete' categ.pk %}">Удалить</a>

      </td>
    </tr>
  {% endfor %}

  </tbody>
  </table>

</div>


{% endblock %}
